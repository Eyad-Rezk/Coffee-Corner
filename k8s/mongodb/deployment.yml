apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb-deploy
  labels:
    app: mongodb
  namespace: coffee

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - containerPort: 27017

          volumeMounts:
            - mountPath: "/data/db"
              name: mongo-pv

      volumes:
        - name: mongo-pv
          persistentVolumeClaim:
            claimName: mongo-pvc