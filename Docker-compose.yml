version: '3.9'

services:

  nginx:
    image: nginx:alpine
    container_name: nginx

    ports:
      - "8080:80"
      - "443:443"

    volumes:
      - ./frontend/vite-project/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/vite-project/nginx/ssl:/etc/nginx/ssl:ro

    networks:
      - net-a

    depends_on:
      - frontend
      - backend


  frontend:
    build:
      context: ./frontend/vite-project/
      args:
        - VITE_API_URL= /main
    container_name: frontend

    networks:
      - net-a



  backend:
    build:
      context: ./backend/

    container_name: backend

    networks:
      - net-a
      - net-b

    environment:
      - MONGO_LOCAL_URI=mongodb://mongodb:27017/coffee


  mongodb:
    image: mongo:8

    container_name: mongodb

    networks:
      - net-b

    volumes:
      - mongo-vol:/data/db


volumes:
  mongo-vol:


networks:

  net-a:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1

  net-b:
    driver: bridge
    ipam:
      config:
        - subnet: 20.0.0.0/24
          gateway: 20.0.0.1